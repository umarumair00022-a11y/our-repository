        <title>REG FORM<title>
    <body>
        <h1>Registration Form</h1>
    <form> action="/destination.html"

      <input
        size="50"
        type="text"
        placeholder="Enter your First Name"
        name="firstName"
        maxlenght="10"
        />

        <br/>
        <br/>

        <input 
        size="50"
        type="text"
        placeholder="Enter your Last Name"
        name="lastName"
        maxlenght="10"
        />

        <br/>
        <br/>

        <input
          size="50"
          type="text"
          placeholder="Enter Your Cell Phone Number"
          name="cellNumber"
          maxlenght="20"
          name="PhoneNumber"
        />

        <br/>
        <br/>

        <input 
        size="50"
        type="text"
        placeholder="Enter Your Password"
        name="password"
        maxlenght="20"
        name="Password"
        />

        <br/>
        <br/>

        <textarea placeholder="Enter Your Address" name="address" maxlenght="100"></textarea>

        <br/>
        <br/>

        <p>Whats your highest level of qualification?</p>

        <input type="radio" name="qualification" value="matric" /> Matric
        <input type="radio" name="qualification" value="intermediate" /> Intermediate
        <input type="radio" name="qualification" value="undergraduate" /> UnderGraduate
        <input type="radio" name="qualification" value="graduate" /> Graduate

        <br/>
        <br/>

        <p>In which course you register?</p>
        <input type="checkbox" name="courseName" value="AI & DS" /> AI & DS
        <input type="checkbox" name="courseName" value="Web & App Development" checked/> Web & App Development
        <input type="checkbox" name="courseName" value="Power Bi" /> Power Bi
        <input type="checkbox" name="courseName" value="fullstacks" /> fullstacks

        <br/>
        <br/>

        <select name="city">
            <option value="karachi">Karachi</option>
            <option value="lahore">Lahore</option>
            <option value="islamabad">Islamabad</option>
            <option value="Queta">Queta</option>
        </select>

        <br/>
        <br/>

        <!-- Call to action (CTA) -->
         <button>Submit</button>
    </form>
