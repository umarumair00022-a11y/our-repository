<!DOCTYPE html>
<html>
  <head>
    <title>Dice Showcase</title>
    <style>
      body {
        background-color: blue;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 30px;
      }
      h1 {
        color: yellow;
      }
      p {
        color: white;
      }

      .die-face {
        background-color: white;
        width: 100px;
        height: 100px;
        border: 4px solid white;
        border-radius: 15px;
      }

      .dot {
        display: block;
        width: 18px;
        height: 18px;
        background-color: grey;
        border-radius: 50%;
      }

      .red-dot {
        background-color: red;
      }
      .empty-space {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>

    <h1>DICE</h1>
    <p>By Umarumair</p>

    <table align="center" cellpadding="20" cellspacing="0" border="0">
      <tr>
        
        <!-- ==================== DICE ONE ==================== -->
        <td>
          <h3>Face 1</h3>
          <table class="die-face" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td valign="middle" align="center">
                <span class="dot red-dot"></span>
              </td>
            </tr>
          </table>
        </td>

        <!-- ==================== DICE TWO ==================== -->
        <td>
          <h3>Face 2</h3>
          <table class="die-face" cellpadding="5" cellspacing="0" border="0">
            <tr>
              <td width="33%" height="33%" valign="top" align="left"><span class="dot"></span></td>
              <td width="33%"></td>
              <td width="33%"></td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td valign="bottom" align="right"><span class="dot"></span></td>
            </tr>
          </table>
        </td>

        <!-- ==================== DICE THREE ==================== -->
        <td>
          <h3>Face 3</h3>
          <table class="die-face" cellpadding="5" cellspacing="0" border="0">
            <tr>
              <td width="33%" height="33%" valign="top" align="left"><span class="dot"></span></td>
              <td width="33%"></td>
              <td width="33%"></td>
            </tr>
            <tr>
              <td></td>
              <td valign="middle" align="center"><span class="dot"></span></td>
              <td></td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td valign="bottom" align="right"><span class="dot"></span></td>
            </tr>
          </table>
        </td>

      </tr>
      <tr><!-- SECOND ROW GRID FOR SYMMETRY -->

        <!-- ==================== DICE FOUR ==================== -->
        <td>
          <h3>Face 4</h3>
          <table class="die-face" cellpadding="5" cellspacing="0" border="0">
            <tr>
              <td width="33%" height="33%" valign="top" align="left"><span class="dot"></span></td>
              <td width="33%"></td>
              <td width="33%" valign="top" align="right"><span class="dot"></span></td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td valign="bottom" align="left"><span class="dot"></span></td>
              <td></td>
              <td valign="bottom" align="right"><span class="dot"></span></td>
            </tr>
          </table>
        </td>

        <!-- ==================== DICE FIVE ==================== -->
        <td>
          <h3>Face 5</h3>
          <table class="die-face" cellpadding="5" cellspacing="0" border="0">
            <tr>
              <td width="33%" height="33%" valign="top" align="left"><span class="dot"></span></td>
              <td width="33%"></td>
              <td width="33%" valign="top" align="right"><span class="dot"></span></td>
            </tr>
            <tr>
              <td></td>
              <td valign="middle" align="center"><span class="dot"></span></td>
              <td></td>
            </tr>
            <tr>
              <td valign="bottom" align="left"><span class="dot"></span></td>
              <td></td>
              <td valign="bottom" align="right"><span class="dot"></span></td>
            </tr>
          </table>
        </td>

        <!-- ==================== DICE SIX ==================== -->
        <td>
          <h3>Face 6</h3>
          <table class="die-face" cellpadding="5" cellspacing="0" border="0">
            <tr>
              <td width="33%" height="33%" valign="top" align="left"><span class="dot"></span></td>
              <td width="33%"></td>
              <td width="33%" valign="top" align="right"><span class="dot"></span></td>
            </tr>
            <tr>
              <td valign="middle" align="left"><span class="dot"></span></td>
              <td></td>
              <td valign="middle" align="right"><span class="dot"></span></td>
            </tr>
            <tr>
              <td valign="bottom" align="left"><span class="dot"></span></td>
              <td></td>
              <td valign="bottom" align="right"><span class="dot"></span></td>
            </tr>
          </table>
        </td>

      </tr>
    </table>

  </body>
</html>
