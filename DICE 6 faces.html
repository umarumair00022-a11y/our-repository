<!DOCTYPE html>

  <head>
    <title>My Simple Dice Webpage</title>
    <!-- We only use this basic CSS block to make the black circles -->
    <style>
      span {
        display: block;
        width: 20px;
        height: 20px;
        background-color: black;
        border-radius: 50%; /* This HTML/CSS trick turns a square into a circle */
      }
    </style>
  </head>

            <tr>

              </td>
            </tr>
          </table>
        </td>
